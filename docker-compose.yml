# ==============================================================================
# PredictIQ - Local Development Infrastructure (Docker Compose)
# ==============================================================================
# Services:
#   1. postgres: Persistent metadata store for MLflow tracking.
#   2. mlflow: MLflow tracking server backed by PostgreSQL and persistent volume.
#
# NOTE: This configuration binds to 127.0.0.1 for local development security.
# ==============================================================================

services:
  postgres:
    image: postgres:16.8-alpine
    container_name: predictiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-predictiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-predictiq_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-predictiq_mlflow}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-predictiq} -d ${POSTGRES_DB:-predictiq_mlflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - predictiq_network

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    container_name: predictiq-mlflow
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-predictiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-predictiq_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-predictiq_mlflow}
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${POSTGRES_USER:-predictiq}:${POSTGRES_PASSWORD:-predictiq_dev_password}@postgres:5432/${POSTGRES_DB:-predictiq_mlflow}
      --default-artifact-root /mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health').read()\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - predictiq_network

volumes:
  postgres_data:
    name: predictiq_postgres_data
  mlflow_artifacts:
    name: predictiq_mlflow_artifacts

networks:
  predictiq_network:
    name: predictiq_network
    driver: bridge
